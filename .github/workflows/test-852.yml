# jobs:
#   repro:
#     runs-on: ubuntu-latest
#     steps:
#       - name: Checkout consumer repo
#         uses: actions/checkout@v7

#       - name: Run the composite action (which passes an absolute path)
#         # Replace YOUR-USERNAME with your GitHub username
#         uses: priya-kinthali/sample-python@test-973
name: setup-node node-version-file — all edge cases

on:
  # push:
  #   branches:
  #     - test-686
  workflow_dispatch:

jobs:
  # ---- Edge case 1: ABSOLUTE path via your composite action (the actual bug) ----
  absolute-path-composite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run composite action (absolute node-version-file)
        uses: priya-kinthali/sample-python@test-973
      - run: node -v        # expect v22.x  (.nvmrc in the action repo = 22)
        shell: bash

  # ---- Edge case 2: RELATIVE path at repo root (regression check) ----
  relative-root:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: .nvmrc
      - run: node -v        # expect v23.11.0  (needs a root .nvmrc = 23 in THIS repo)
        shell: bash

  # ---- Edge case 3: RELATIVE path in a subfolder ----
  relative-subfolder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: config/.node-version
      - run: node -v        # expect v20.x  (needs config/.node-version = 20 in THIS repo)

  # ---- Edge case 4: ABSOLUTE path built explicitly with $GITHUB_WORKSPACE ----
  absolute-in-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: ${{ github.workspace }}/.nvmrc
      - run: node -v        # expect v18.x  (absolute path inside workspace, uses root .nvmrc)
        shell: bash

  # ---- Edge case 5: NON-EXISTENT file must fail cleanly (negative test) ----
  missing-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup
        continue-on-error: true
        uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: does/not/exist/.nvmrc
      - name: Assert the step failed
        if: steps.setup.outcome == 'success'
        run: echo "ERROR expected failure but step succeeded" && exit 1
      - name: Confirm expected failure
        if: steps.setup.outcome == 'failure'
        run: echo "OK missing file correctly failed"

  # ---- Edge case 6: node-version + node-version-file both set (warning, version wins) ----
  both-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version: 20
          node-version-file: .nvmrc   # 18 — should be ignored with a warning
      - run: node -v        # expect v20.x (node-version wins)
  # ---- Edge case 7: ABSOLUTE path to .tool-versions file ----
  absolute-tool-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: ${{ github.workspace }}/.tool-versions
      - run: node -v        # expect v18.x  (absolute path to .tool-versions, uses root .tool-versions)
  empty-version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version: 20            # fallback that should actually be used
          node-version-file: ''       # empty → must be ignored, not resolved to a dir
      - run: node -v                  # expect v20.x (came from node-version, not the empty file)
  trailing-whitespace-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          # NOTE the intentional trailing space after .nvmrc
          node-version-file: "${{ github.workspace }}/.nvmrc "
      - run: node -v                  # expect the root .nvmrc version (path tolerated despite trailing space)
  check-latest-absolute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: ${{ github.workspace }}/.nvmrc
          check-latest: true          # force querying newest matching release
      - run: node -v                  # expect latest patch of the major in root .nvmrc
  absolute-with-traversal:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
          with:
            node-version-file: ${{ github.workspace }}/../sample-node/.nvmrc
        - run: node -v                  # expect the root .nvmrc version (path normalized back into workspace)
  windows-absolute:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: ${{ github.workspace }}\.nvmrc   # backslash, Windows-style absolute
      - run: node -v                  # expect the root .nvmrc version
  absolute-package-json-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
        with:
          node-version-file: ${{ github.workspace }}/engines-pkg/package.json
      - run: node -v                  # expect the version from engines.node (e.g. v18.20.4)
  absolute-package-json-volta:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
          with:
            node-version-file: ${{ github.workspace }}/volta-pkg/package.json
        - run: node -v                  # expect the version from volta.node (e.g. v20.11.1)
  absolute-nested-composite:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - name: Run composite action that reads a nested absolute version file
          uses: priya-kinthali/sample-python@test-973
        - run: node -v                  # expect the nested/.node-version value from the action repo